name: Release

# Cross-platform Tauri build + draft GitHub Release.
# Triggers: push a tag like `v1.2.3`, or run manually (Actions → Release → Run).
# Each runner builds the kondi-guard containment sidecar for its own platform,
# builds the frontend, then bundles + uploads native installers.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest   # Apple silicon (aarch64)
            args: ''
          - platform: macos-13        # Intel (x86_64)
            args: ''
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: mcp-connect-mvp/src-tauri -> target

      - name: Install Linux dependencies (Tauri v2)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential curl wget file \
            libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        working-directory: mcp-connect-mvp
        run: npm install

      - name: Build containment guard sidecar
        working-directory: mcp-connect-mvp/src-tauri
        shell: bash
        run: bash build-guard.sh

      - name: Build frontend
        # NOTE: `npm run build` runs `tsc -b`, which has pre-existing project-ref
        # errors; vite/esbuild transpiles cleanly. `tsc --noEmit` is the type gate.
        working-directory: mcp-connect-mvp
        run: npx vite build

      - name: Build app + create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Enable these by adding the matching repo secrets ---
          # macOS signing + notarization:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Updater artifact signing (Tauri updater plugin):
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: mcp-connect-mvp
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'kondi-v__VERSION__' }}
          releaseName: 'Kondi v__VERSION__'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
