# Kondi marketing site — nginx server block.
# Put this at /etc/nginx/sites-available/kondi (Ubuntu/nginx) and symlink into
# sites-enabled, OR paste into your existing nginx config. Replace YOURDOMAIN.
# certbot will rewrite this to add the 443 block + HTTP->HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name YOURDOMAIN www.YOURDOMAIN;

    root /var/www/kondi;
    index index.html;

    # single-file site; the hash router (#/examples) is handled client-side
    location / {
        try_files $uri /index.html;
    }

    # long-cache the immutable single file lightly (it changes on redeploy)
    location = /index.html {
        add_header Cache-Control "public, max-age=300";
    }
}
