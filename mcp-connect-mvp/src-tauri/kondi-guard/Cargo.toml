[package]
name = "kondi-guard"
version = "0.1.0"
description = "Kondi PreToolUse write-containment sidecar (no Tauri/GTK deps)"
edition = "2021"
rust-version = "1.77.2"

# Deliberately minimal: serde_json + std only. Keeping this OUT of the Tauri app
# crate means building the guard does NOT run tauri-build (which validates the
# externalBin sidecar — a chicken-and-egg) and needs no GTK/webkit system libs.
[dependencies]
serde_json = "1.0"

[[bin]]
name = "kondi-guard"
path = "src/main.rs"
