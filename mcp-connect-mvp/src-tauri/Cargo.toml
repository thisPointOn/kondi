[package]
name = "kondi"
version = "0.1.0"
description = "Kondi - Connect AI to your tools"
authors = ["you"]
license = "AGPL-3.0-only"
repository = ""
edition = "2021"
rust-version = "1.77.2"
# The guard sidecar is a SEPARATE crate (./kondi-guard) so building it doesn't
# drag in tauri-build / GTK or hit the externalBin chicken-and-egg (you can't
# cargo-build this crate to PRODUCE the sidecar that tauri-build then validates).
# The workspace makes both crates share this target dir.
[workspace]
members = ["kondi-guard"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "kondi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.9.5", features = ["devtools", "image-png"] }
tauri-plugin-store = "2.2.0"
reqwest = { version = "0.12.8", default-features = false, features = ["json", "rustls-tls"] }
tiny_http = "0.12"
rand = "0.8"
sha2 = "0.10"
base64 = "0.21"
webbrowser = "0.8"
url = "2.4"
tokio = { version = "1", features = ["sync", "process", "io-util", "time"] }
urlencoding = "2.1"
dirs = "5.0"
chrono = "0.4"
zip = "0.6"
flate2 = "1.0"
tar = "0.4"
uuid = { version = "1.0", features = ["v4"] }
tauri-plugin-dialog = "2"
